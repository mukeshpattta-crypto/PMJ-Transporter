const RB=[['toll','t','Toll'],['lab','lb','Labour'],['ex','e','Extra pts'],['hal','h','Halting']];
function rbx(c,compact){const it=RB.filter(x=>!compact||c[x[0]]);if(!it.length)return'';return`<div>${it.map(x=>`<span class="ch ${x[1]}">${x[2]} ${fmt(c[x[0]])}</span>`).join('')}${compact?'':`<span class="ch r">= ${t('reimb')} ${fmt(c.reimb)}</span>`}</div>`}
function rbBar(c){const tot=c.reimb||1;return`<div class="sb">${RB.map(x=>`<div style="width:${c[x[0]]/tot*100}%;background:var(--${x[0]=='lab'?'lab':x[0]=='ex'?'ext':x[0]})"></div>`).join('')}</div>`}

// ---- Recycle bin: deleted trips/expenses hidden everywhere, kept here
const binBtn=()=>{const c=S.trips.concat(S.exps).filter(x=>x.deleted).length;return`<button class="s" style="float:right" onclick="tab='bin';FM=null;render()">🗑 Recycle bin${c?' ('+c+')':''}</button>`};
const delAt=id=>{const h=S.hist.filter(x=>x.id==id&&x.action=='delete').pop();if(!h)return'';const d=new Date(h.time);return dmy(ymd(d))+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())};
function vBin(){const DT=S.trips.filter(x=>x.deleted).sort((a,b)=>b.date>a.date?1:-1),DE=S.exps.filter(x=>x.deleted).sort((a,b)=>b.date>a.date?1:-1);
 const card=(k,x,top,sub)=>`<div class="card"><div class="row" style="border:0"><b>${top}</b><button class="s" onclick="tog('${k}','${x.id}')">↩ ${t('rest')}</button></div><div class="mut">${sub}${delAt(x.id)?' · deleted '+delAt(x.id):''}</div></div>`;
 $('#v').innerHTML=`<div class="card"><button class="s" onclick="tab='trips';render()">← Back</button> <b style="margin-left:8px">🗑 Recycle bin</b><p class="mut">Deleted items are kept here. They are not counted in the dashboard or Excel (unless you tick “Include deleted” while exporting).</p></div>`
 +(DT.length?`<p class="mut" style="margin:0 14px">${t('trips')} (${DT.length})</p>`+DT.map(x=>card('trips',x,`${dmy(x.date)} · ${esc(x.veh)} → ${esc(x.dest)}`,`LR ${esc(x.lr||'-')} · ${calc(x).km} km${x.driver?' · '+esc(x.driver):''}`)).join(''):'')
 +(DE.length?`<p class="mut" style="margin:8px 14px 0">${t('exp')} (${DE.length})</p>`+DE.map(x=>card('exps',x,`${dmy(x.date)} · ${esc(x.veh)} · ${esc(x.desc)}`,fmt(n(x.cost)))).join(''):'')
 +(DT.length+DE.length?'':`<p class="mut" style="margin:14px">Recycle bin is empty.</p>`)}

// ---- safety: deleted/restored items stay that way even if the sheet missed it
function applyTomb(){const T=S.tomb||{};Object.entries(T).forEach(([id,o])=>{const x=(S[o.k]||[]).find(y=>y.id==id);if(!x){if(Date.now()-o.t>864e5*60)delete T[id];return}
 if(!!x.deleted!=o.del){x.deleted=o.del;x.status=o.del?'Deleted':'Active';if(!x._pend)x._pend='edit'}else if(!x._pend&&Date.now()-o.t>864e5*30)delete T[id]});S.tomb=T;save()}
