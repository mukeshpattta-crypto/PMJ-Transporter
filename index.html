<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMJ Transporter</title>

<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2320;--mut:#6b736e;--acc:#0f5c4d;--warn:#b4412a;--ln:#dcd8cf}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--card:#202623;--ink:#ecefed;--mut:#9aa39e;--acc:#4fc2a8;--warn:#ef8a73;--ln:#333b37}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Noto Sans Devanagari",sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--acc);color:#fff;position:sticky;top:0;z-index:5}
header b{font-size:18px}select,input,button,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-column:1/-1}
button{border:0;border-radius:8px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600}
button.s{background:none;color:var(--acc);border:1px solid var(--acc);padding:6px 10px;font-size:13px}button.d{color:var(--warn);border-color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k div{background:var(--bg);border-radius:10px;padding:10px}.k small{color:var(--mut);display:block}.k b{font-size:20px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.p{color:var(--acc)}.l{color:var(--warn)}.del{opacity:.5;text-decoration:line-through}.hint{background:var(--bg);padding:8px;border-radius:8px;font-size:14px;margin-top:8px}
.bar{height:10px;background:var(--acc);border-radius:5px}.mut{color:var(--mut);font-size:13px}.hide{display:none}
</style></head><body>
<div id="app"></div>
<script>
const RC={sizes:["TATA ACE","407/PICKUP 10 FT","12 - 14 FT","17 FT","19 FT","22 FT"],

const T={en:{trips:"Trips",exp:"Expenses",dash:"Dashboard",set:"Settings",date:"Date",lr:"LR No (comma separated)",veh:"Vehicle No",size:"Vehicle size",dest:"Destination",start:"Start KM",end:"End KM",toll:"Toll",labour:"Labour charges",wages:"Driver wages",driver:"Driver name",points:"Extra points",halt:"Halting charges",save:"Save",cancel:"Cancel",edit:"Edit",del:"Delete",rest:"Restore",desc:"Description",qty:"Qty",cost:"Cost",rem:"Remark",bill:"Photo of bill",login:"Login",pin:"PIN",total:"Total cost",reimb:"Reimbursable",billable:"Billable to Onida",profit:"Profit / Loss",est:"Estimate for this trip",rate:"Onida rate",km:"Trip KM",diesel:"Diesel cost",perkm:"Diesel cost per KM",ep:"Extra point rate",url:"Google Sheet web app URL",hist:"History",out:"Logout",trip:"trips",revenue:"Billable",spend:"Total cost",expTot:"Other expenses",byDest:"Trips by destination",byVeh:"Profit by vehicle",empty:"Nothing yet. Tap Add."},
hi:{trips:"ट्रिप",exp:"खर्च",dash:"डैशबोर्ड",set:"सेटिंग",date:"तारीख",lr:"LR नंबर (कॉमा से अलग)",veh:"गाड़ी नंबर",size:"गाड़ी का साइज़",dest:"गंतव्य",start:"शुरू KM",end:"अंत KM",toll:"टोल",labour:"मजदूरी",wages:"ड्राइवर वेतन",driver:"ड्राइवर नाम",points:"एक्स्ट्रा पॉइंट",halt:"हॉल्टिंग",save:"सेव",cancel:"रद्द",edit:"बदलें",del:"हटाएं",rest:"वापस लाएं",desc:"विवरण",qty:"मात्रा",cost:"लागत",rem:"टिप्पणी",bill:"बिल की फोटो",login:"लॉगिन",pin:"पिन",total:"कुल लागत",reimb:"वापसी योग्य",billable:"Onida को बिल",profit:"लाभ / हानि",est:"इस ट्रिप का अनुमान",rate:"Onida रेट",km:"ट्रिप KM",diesel:"डीज़ल खर्च",perkm:"डीज़ल प्रति KM",ep:"एक्स्ट्रा पॉइंट रेट",url:"Google Sheet वेब ऐप URL",hist:"इतिहास",out:"लॉगआउट",trip:"ट्रिप",revenue:"बिल",spend:"कुल लागत",expTot:"अन्य खर्च",byDest:"गंतव्य अनुसार ट्रिप",byVeh:"गाड़ी अनुसार लाभ",empty:"अभी कुछ नहीं। जोड़ें दबाएं।"},
mr:{trips:"ट्रिप",exp:"खर्च",dash:"डॅशबोर्ड",set:"सेटिंग",date:"तारीख",lr:"LR क्रमांक (स्वल्पविरामाने)",veh:"गाडी क्रमांक",size:"गाडीचा आकार",dest:"गंतव्य",start:"सुरुवात KM",end:"शेवट KM",toll:"टोल",labour:"हमाली",wages:"ड्रायव्हर पगार",driver:"ड्रायव्हरचे नाव",points:"एक्स्ट्रा पॉइंट",halt:"हॉल्टिंग",save:"सेव्ह",cancel:"रद्द",edit:"बदला",del:"काढा",rest:"परत आणा",desc:"तपशील",qty:"संख्या",cost:"खर्च",rem:"शेरा",bill:"बिलाचा फोटो",login:"लॉगिन",pin:"पिन",total:"एकूण खर्च",reimb:"परतावा मिळणारा",billable:"Onida ला बिल",profit:"नफा / तोटा",est:"या ट्रिपचा अंदाज",rate:"Onida दर",km:"ट्रिप KM",diesel:"डिझेल खर्च",perkm:"डिझेल प्रति KM",ep:"एक्स्ट्रा पॉइंट दर",url:"Google Sheet वेब ॲप URL",hist:"इतिहास",out:"लॉगआउट",trip:"ट्रिप",revenue:"बिल",spend:"एकूण खर्च",expTot:"इतर खर्च",byDest:"गंतव्यानुसार ट्रिप",byVeh:"गाडीनुसार नफा",empty:"काही नाही. जोडा दाबा."}};
let S=JSON.parse(localStorage.pmj||'null')||{lang:'en',trips:[],exps:[],hist:[],set:{extra:500,dieselKm:{},url:''}};
S.set.halt=S.set.halt||{free:1,perDay:{}};S.set.url=S.set.url||'https://script.google.com/macros/s/AKfycbzygncMnieFyDmv7zjvMshpW3p109Dc7VGksHhAJCif4iGdEsmXxQQFQsUpVsaToV7NHg/exec';if(S.set.rc)RC.r=S.set.rc;
Object.assign(T.en,{hdays:'Halting days',rc:'Rate card editor',hr:'Halting rules',free:'Free halting days',perday:'Charge per extra day',addd:'Add destination',exp2:'Export data',last:'Last export',autoE:'Auto backup downloaded',saved:'Saved',noRC:'Pick a destination',rate1:'Rates (₹)'});
Object.assign(T.hi,{hdays:'हॉल्टिंग दिन',rc:'रेट कार्ड एडिटर',hr:'हॉल्टिंग नियम',free:'फ्री हॉल्टिंग दिन',perday:'अतिरिक्त दिन का चार्ज',addd:'गंतव्य जोड़ें',exp2:'डेटा एक्सपोर्ट',last:'पिछला एक्सपोर्ट',autoE:'ऑटो बैकअप डाउनलोड हुआ',saved:'सेव हुआ',noRC:'गंतव्य चुनें',rate1:'रेट (₹)'});
Object.assign(T.mr,{hdays:'हॉल्टिंग दिवस',rc:'रेट कार्ड एडिटर',hr:'हॉल्टिंग नियम',free:'फ्री हॉल्टिंग दिवस',perday:'जादा दिवसाचा चार्ज',addd:'गंतव्य जोडा',exp2:'डेटा एक्सपोर्ट',last:'मागील एक्सपोर्ट',autoE:'ऑटो बॅकअप डाउनलोड झाला',saved:'सेव्ह झाले',noRC:'गंतव्य निवडा',rate1:'दर (₹)'});
let U=null,tab='trips',form=null;const $=s=>document.querySelector(s),t=k=>T[S.lang][k]||T.en[k]||k;
const save=()=>localStorage.pmj=JSON.stringify(S),n=v=>+v||0,fmt=v=>'₹'+Math.round(v).toLocaleString('en-IN'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const adm=()=>U&&U.role=='admin';
async function api(m,body){if(!S.set.url)return null;try{const r=m=='GET'?await fetch(S.set.url+'?pin='+U.pin):await fetch(S.set.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,pin:U.pin})});return await r.json()}catch(e){toast('Offline: saved on phone');return null}}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:8px;z-index:9';document.body.append(d);setTimeout(()=>d.remove(),2200)}
function calc(f){const km=Math.max(0,n(f.end)-n(f.start)),dk=n(S.set.dieselKm[f.veh]||f.dieselKm),pts=n(f.points),ex=pts*n(S.set.extra),rate=(RC.r[f.dest]||[])[RC.sizes.indexOf(f.size)]||0,diesel=km*dk,reimb=n(f.toll)+n(f.labour)+ex;
 const total=diesel+reimb+n(f.wages);const bill=rate+reimb+n(f.halting);return{km,dk,ex,rate,diesel,reimb,total,bill,profit:bill-total}}
function guess(f){const p=S.trips.filter(x=>!x.deleted&&(x.dest==f.dest&&x.size==f.size));if(!p.length)return null;const a=k=>p.reduce((s,x)=>s+n(x[k]),0)/p.length;
 const km=p.reduce((s,x)=>s+n(x.end)-n(x.start),0)/p.length,dk=n(S.set.dieselKm[f.veh]||a('dieselKm')),rate=(RC.r[f.dest]||[])[RC.sizes.indexOf(f.size)]||0;
 const re=a('toll')+a('labour')+a('points')*n(S.set.extra),cost=km*dk+re+a('wages');return{km,cost,rate,profit:rate+re-cost,n:p.length,toll:a('toll'),labour:a('labour'),wages:a('wages')}}
function login(){$('#app').innerHTML=`<header><b>PMJ Transporter</b>${langSel()}</header><div class="card"><label>${t('login')}</label><select id="r"><option value="admin">Admin</option><option value="transporter">Transporter</option></select><label>${t('pin')}</label><input id="pin" type="password" inputmode="numeric"><p class="mut">Demo PINs (no sheet linked): Admin 1111, Transporter 2222. Change in Settings.</p><button onclick="doLogin()">${t('login')}</button></div>`}
const langSel=()=>`<select style="width:auto" onchange="S.lang=this.value;save();render()">${[['en','English'],['hi','हिंदी'],['mr','मराठी']].map(l=>`<option value="${l[0]}" ${S.lang==l[0]?'selected':''}>${l[1]}</option>`).join('')}</select>`;
async function doLogin(){const r=$('#r').value,pin=$('#pin').value;U={role:r,pin};
 if(S.set.url){const d=await api('GET');if(!d||d.error){U=null;return toast('Wrong PIN or no connection')}U.role=d.role;for(const k in d.settings||{}){try{S.set[k]=JSON.parse(d.settings[k])}catch(e){}}if(S.set.rc)RC.r=S.set.rc;S.trips=d.trips.map(x=>({...x,deleted:x.status=='Deleted'}));S.exps=d.exps.map(x=>({...x,deleted:x.status=='Deleted'}));save()}
 else{const p=S.set.pins||{admin:'1111',transporter:'2222'};if(p[r]!=pin){U=null;return toast('Wrong PIN')}}render()}
function render(){if(!U)return login();const tabs=[['trips','trips'],['exp','exp'],['dash','dash']].concat(adm()?[['set','set']]:[]);
 $('#app').innerHTML=`<header><b>PMJ · ${adm()?'Admin':'Transporter'}</b><span>${langSel()} <button class="s" style="color:#fff;border-color:#fff" onclick="U=null;render()">${t('out')}</button></span></header><div id="v"></div><nav>${tabs.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';form=null;render()">${t(x[1])}</button>`).join('')}</nav>`;
 ({trips:vTrips,exp:vExp,dash:vDash,set:vSet})[tab]()}
const inp=(k,lb,ty='text',ex='')=>`<div><label>${t(lb)}</label><input id="f_${k}" type="${ty}" value="${(form[k]??'')}" oninput="form.${k}=this.value;${ex}"></div>`;
function vTrips(){if(form)return tripForm();const L=S.trips.slice().sort((a,b)=>b.date>a.date?1:-1);
 $('#v').innerHTML=`<div class="card"><button onclick="form={id:uid(),date:new Date().toISOString().slice(0,10),points:0,halting:0};render()">+ ${t('trips')}</button></div>`+(L.length?L.map(x=>{const c=calc(x);return`<div class="card ${x.deleted?'del':''}"><div class="row" style="border:0"><b>${x.date} · ${x.veh}</b><span>${x.dest}</span></div><div class="mut">${x.size} · ${c.km} km · LR ${x.lr||'-'}</div>${adm()?`<div>${t('billable')}: ${fmt(c.bill)} · <b class="${c.profit<0?'l':'p'}">${fmt(c.profit)}</b></div>`:`<div>${t('reimb')}: ${fmt(c.reimb)}</div>`}<p>${x.deleted?`<button class="s" onclick="tog('trips','${x.id}')">${t('rest')}</button>`:`<button class="s" onclick="form=S.trips.find(y=>y.id=='${x.id}');render()">${t('edit')}</button> <button class="s d" onclick="tog('trips','${x.id}')">${t('del')}</button>`}</p></div>`}).join(''):`<p class="mut" style="margin:14px">${t('empty')}</p>`)}
function tripForm(){const f=form,vs=[...new Set(S.trips.map(x=>x.veh))],ds=[...new Set(S.trips.map(x=>x.driver))];
 $('#v').innerHTML=`<div class="card"><div class="g">${inp('date','date','date')}<div><label>${t('veh')}</label><input id="f_veh" list="vl" value="${f.veh||''}" oninput="form.veh=this.value.toUpperCase();fill()"><datalist id="vl">${vs.map(v=>`<option>${v}`).join('')}</datalist></div>
 <div class="g3"><label>${t('lr')}</label><input value="${f.lr||''}" oninput="form.lr=this.value"></div>
 <div><label>${t('size')}</label><select onchange="form.size=this.value;if(form.hdays)autoHalt();else upd()"><option value="">-</option>${RC.sizes.map(s=>`<option ${f.size==s?'selected':''}>${s}`).join('')}</select></div>
 <div><label>${t('dest')}</label><input list="dl" value="${f.dest||''}" oninput="form.dest=this.value.toUpperCase();upd()"><datalist id="dl">${Object.keys(RC.r).map(d=>`<option>${d}`).join('')}</datalist></div>
 ${inp('start','start','number','upd()')}${inp('end','end','number','upd()')}${inp('toll','toll','number','upd()')}${inp('labour','labour','number','upd()')}${inp('wages','wages','number','upd()')}
 <div><label>${t('driver')}</label><input list="drl" value="${f.driver||''}" oninput="form.driver=this.value"><datalist id="drl">${ds.map(v=>`<option>${v}`).join('')}</datalist></div>
 ${inp('points','points','number','upd()')}${inp('hdays','hdays','number','autoHalt()')}${inp('halting','halt','number','upd()')}
 <div><label>${t('perkm')}</label><input type="number" step="0.1" value="${S.set.dieselKm[f.veh]??f.dieselKm??''}" oninput="form.dieselKm=this.value;S.set.dieselKm[form.veh]=+this.value;upd()"></div></div>
 <div id="sum" class="k" style="margin-top:12px"></div><div id="est"></div><p><button onclick="saveTrip()">${t('save')}</button> <button class="s" onclick="form=null;render()">${t('cancel')}</button></p></div>`;upd()}
const haltAmt=f=>Math.max(0,n(f.hdays)-n(S.set.halt.free))*n(S.set.halt.perDay[f.size]);
function autoHalt(){form.halting=haltAmt(form);$('#f_halting').value=form.halting;upd()}
function fill(){const p=S.trips.filter(x=>x.veh==form.veh).pop();if(p&&!form.size){Object.assign(form,{size:p.size,driver:p.driver,wages:p.wages,dieselKm:p.dieselKm});tripForm()}}
function upd(){const c=calc(form),e=guess(form);let h=`<div><small>${t('km')}</small><b>${c.km}</b></div><div><small>${t('diesel')}</small><b>${fmt(c.diesel)}</b></div><div><small>${t('reimb')}</small><b>${fmt(c.reimb)}</b></div>`;
 if(adm())h+=`<div><small>${t('rate')}</small><b>${fmt(c.rate)}</b></div><div><small>${t('total')}</small><b>${fmt(c.total)}</b></div><div><small>${t('profit')}</small><b class="${c.profit<0?'l':'p'}">${fmt(c.profit)}</b></div>`;else h+=`<div><small>${t('total')}</small><b>${fmt(c.total)}</b></div>`;
 $('#sum').innerHTML=h;$('#est').innerHTML=e?`<div class="hint">💡 ${t('est')} (${e.n} ${t('trip')}): ~${Math.round(e.km)} km · ${fmt(e.cost)}${adm()?' · '+t('profit')+' '+fmt(e.profit):''}</div>`:''}
async function saveTrip(){const f=form;if(!f.veh||!f.dest)return toast('Vehicle + destination?');const c=calc(f),i=S.trips.findIndex(x=>x.id==f.id);
 Object.assign(f,{km:c.km,rate:c.rate,diesel:c.diesel,totalCost:c.total,reimb:c.reimb,billable:c.bill,profit:c.profit,extraRate:S.set.extra,status:'Active'});
 log('Trips',f,i<0?'create':'edit');if(i<0)S.trips.push(f);else S.trips[i]=f;save();await api('POST',{action:i<0?'create':'edit',sheet:'Trips',data:f});form=null;render()}
function log(s,d,a){S.hist.push({time:new Date().toISOString(),role:U.role,sheet:s,id:d.id,action:a,data:JSON.stringify(d)})}
async function tog(k,id){const x=S[k].find(y=>y.id==id);x.deleted=!x.deleted;x.status=x.deleted?'Deleted':'Active';log(k=='trips'?'Trips':'Expenses',x,x.deleted?'delete':'restore');save();await api('POST',{action:x.deleted?'delete':'restore',sheet:k=='trips'?'Trips':'Expenses',data:x});render()}
function vExp(){if(form)return expForm();$('#v').innerHTML=`<div class="card"><button onclick="form={id:uid(),date:new Date().toISOString().slice(0,10),qty:1};render()">+ ${t('exp')}</button></div>`+(S.exps.length?S.exps.slice().reverse().map(x=>`<div class="card ${x.deleted?'del':''}"><div class="row" style="border:0"><b>${x.veh} · ${x.desc}</b><b>${fmt(n(x.cost))}</b></div><div class="mut">${x.date} · ${t('qty')} ${x.qty} · ${x.remark||''}</div><p>${x.billUrl?`<a href="${x.billUrl}" target="_blank" ${x.billUrl.startsWith('data:')?'download="bill.pdf"':''}>📄 PDF</a> `:''}${x.deleted?`<button class="s" onclick="tog('exps','${x.id}')">${t('rest')}</button>`:`<button class="s" onclick="form=S.exps.find(y=>y.id=='${x.id}');render()">${t('edit')}</button> <button class="s d" onclick="tog('exps','${x.id}')">${t('del')}</button>`}</p></div>`).join(''):`<p class="mut" style="margin:14px">${t('empty')}</p>`)}
function expForm(){const f=form,vs=[...new Set(S.trips.concat(S.exps).map(x=>x.veh))],ds=[...new Set(S.exps.map(x=>x.desc))];
 $('#v').innerHTML=`<div class="card"><div class="g">${inp('date','date','date')}<div><label>${t('veh')}</label><input list="vl" value="${f.veh||''}" oninput="form.veh=this.value.toUpperCase()"><datalist id="vl">${vs.map(v=>`<option>${v}`).join('')}</datalist></div>
 <div class="g3"><label>${t('desc')}</label><input list="xl" value="${f.desc||''}" oninput="form.desc=this.value"><datalist id="xl">${['Tyre','Engine oil','Service','Battery','Brake pads','Puncture','Insurance','RTO / permit'].concat(ds).map(v=>`<option>${v}`).join('')}</datalist></div>
 ${inp('qty','qty','number')}${inp('cost','cost','number')}<div class="g3">${inp('remark','rem')}</div>
 <div class="g3"><label>${t('bill')}</label><input type="file" accept="image/*" capture="environment" onchange="shot(this)"><p id="bs" class="mut">${f.billUrl?'📄 PDF attached':''}</p></div></div><p><button onclick="saveExp()">${t('save')}</button> <button class="s" onclick="form=null;render()">${t('cancel')}</button></p></div>`}
function shot(el){const file=el.files[0];if(!file)return;const im=new Image();im.onload=async()=>{const sc=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const {jsPDF}=window.jspdf,p=new jsPDF({unit:'px',format:[c.width,c.height]});p.addImage(c.toDataURL('image/jpeg',.7),'JPEG',0,0,c.width,c.height);const b64=p.output('datauristring').split(',')[1];$('#bs').textContent='Uploading…';
 const r=await api('POST',{action:'bill',name:`${form.veh||'bill'}_${form.date}.pdf`,data:b64});form.billUrl=r&&r.url?r.url:'data:application/pdf;base64,'+b64;$('#bs').textContent='📄 PDF ready'};im.src=URL.createObjectURL(file)}
async function saveExp(){const f=form;if(!f.veh||!f.desc)return toast('Vehicle + description?');const i=S.exps.findIndex(x=>x.id==f.id);f.status='Active';log('Expenses',f,i<0?'create':'edit');i<0?S.exps.push(f):S.exps[i]=f;save();await api('POST',{action:i<0?'create':'edit',sheet:'Expenses',data:f});form=null;render()}
function vDash(){const T=S.trips.filter(x=>!x.deleted),E=S.exps.filter(x=>!x.deleted),C=T.map(calc),sum=(a,k)=>a.reduce((s,x)=>s+x[k],0),ex=E.reduce((s,x)=>s+n(x.cost),0),by={};
 T.forEach(x=>by[x.dest]=(by[x.dest]||0)+1);const mx=Math.max(1,...Object.values(by)),vp={};T.forEach((x,i)=>vp[x.veh]=(vp[x.veh]||0)+C[i].profit);
 let h=`<div class="card"><div class="k"><div><small>${t('trips')}</small><b>${T.length}</b></div><div><small>${t('km')}</small><b>${sum(C,'km')}</b></div><div><small>${t('reimb')}</small><b>${fmt(sum(C,'reimb'))}</b></div><div><small>${t('expTot')}</small><b>${fmt(ex)}</b></div>`;
 if(adm())h+=`<div><small>${t('revenue')}</small><b>${fmt(sum(C,'bill'))}</b></div><div><small>${t('spend')}</small><b>${fmt(sum(C,'total')+ex)}</b></div><div style="grid-column:1/-1"><small>${t('profit')}</small><b class="${sum(C,'profit')-ex<0?'l':'p'}">${fmt(sum(C,'profit')-ex)}</b></div>`;
 h+=`</div></div><div class="card"><b>${t('byDest')}</b>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([d,v])=>`<div style="margin-top:8px">${d} (${v})<div class="bar" style="width:${v/mx*100}%"></div></div>`).join('')||`<p class="mut">${t('empty')}</p>`}</div>`;
 if(adm())h+=`<div class="card"><b>${t('byVeh')}</b>${Object.entries(vp).map(([v,p])=>`<div class="row"><span>${v}</span><b class="${p<0?'l':'p'}">${fmt(p)}</b></div>`).join('')}</div>`;$('#v').innerHTML=h}
const pushSet=()=>{save();api('POST',{action:'settings',data:S.set});toast(t('saved'))};
let rcSel='';
function vSet(){const s=S.set;$('#v').innerHTML=`<div class="card"><label>${t('ep')}</label><input type="number" value="${s.extra}" onchange="S.set.extra=+this.value;pushSet()"><label>${t('url')}</label><input value="${s.url||''}" onchange="S.set.url=this.value.trim();save()" placeholder="https://script.google.com/macros/s/.../exec"><p class="mut">With a URL set, PINs are checked by the Google Sheet (ADMIN_PIN / DRIVER_PIN).</p>
 ${s.url?'':`<label>Admin PIN</label><input value="${(s.pins||{}).admin||'1111'}" onchange="S.set.pins={...(S.set.pins||{admin:'1111',transporter:'2222'}),admin:this.value};save()"><label>Transporter PIN</label><input value="${(s.pins||{}).transporter||'2222'}" onchange="S.set.pins={...(S.set.pins||{admin:'1111',transporter:'2222'}),transporter:this.value};save()">`}</div>
 <div class="card"><b>${t('hist')}</b>${S.hist.slice(-30).reverse().map(h=>`<div class="row"><span>${h.action} · ${h.sheet}</span><span class="mut">${h.role} · ${h.time.slice(0,16).replace('T',' ')}</span></div>`).join('')||`<p class="mut">${t('empty')}</p>`}</div>`}
const _vs=vSet;vSet=function(){_vs();const h=S.set.halt,d=rcSel&&RC.r[rcSel];
$('#v').insertAdjacentHTML('afterbegin',`<div class="card"><b>${t('hr')}</b><label>${t('free')}</label><input type="number" value="${h.free}" onchange="S.set.halt.free=+this.value;pushSet()"><label>${t('perday')}</label><div class="g">${RC.sizes.map(z=>`<div><label>${z}</label><input type="number" value="${h.perDay[z]||''}" onchange="S.set.halt.perDay['${z}']=+this.value;pushSet()"></div>`).join('')}</div></div>
<div class="card"><b>${t('rc')}</b><label>${t('dest')}</label><select onchange="rcSel=this.value;render()"><option value="">-</option>${Object.keys(RC.r).map(x=>`<option ${x==rcSel?'selected':''}>${x}`).join('')}</select>${d?`<label>${t('rate1')}</label><div class="g">${RC.sizes.map((z,i)=>`<div><label>${z}</label><input type="number" value="${d[i]}" onchange="RC.r['${rcSel}'][${i}]=+this.value;S.set.rc=RC.r;pushSet()"></div>`).join('')}</div><p><button class="s d" onclick="if(confirm('Delete '+rcSel+'?')){delete RC.r[rcSel];rcSel='';S.set.rc=RC.r;pushSet();render()}">${t('del')}</button></p>`:`<p class="mut">${t('noRC')}</p>`}<label>${t('addd')}</label><input id="nd" placeholder="NAME"><p><button class="s" onclick="addDest()">+ ${t('addd')}</button></p></div>`)};
function addDest(){const v=$('#nd').value.trim().toUpperCase();if(!v||RC.r[v])return toast('Name?');RC.r[v]=RC.sizes.map(()=>0);S.set.rc=RC.r;rcSel=v;pushSet();render()}
function csv(rows,cols){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove()}
function exportAll(auto){const d=new Date().toISOString().slice(0,10),fin=['rate','diesel','totalCost','billable','profit'],tc=['date','lr','veh','size','dest','start','end','km','toll','labour','wages','driver','dieselKm','points','hdays','halting','remark'].concat(adm()?fin:[],['reimb','status']),ec=['date','veh','desc','qty','cost','remark','billUrl','status'];
 const tr=S.trips.map(x=>({...x,km:calc(x).km,status:x.deleted?'Deleted':'Active'})),ex=S.exps.map(x=>({...x,status:x.deleted?'Deleted':'Active'}));
 dl(`PMJ_trips_${d}.csv`,csv(tr,tc),'text/csv');setTimeout(()=>dl(`PMJ_expenses_${d}.csv`,csv(ex,ec),'text/csv'),600);
 setTimeout(()=>dl(`PMJ_backup_${d}.json`,JSON.stringify({exported:new Date().toISOString(),trips:S.trips.map(x=>adm()?x:Object.fromEntries(Object.entries(x).filter(e=>!fin.includes(e[0])))),exps:S.exps,history:adm()?S.hist:[],settings:adm()?S.set:{}}),'application/json'),1200);
 S.set.lastExport=new Date().toISOString();save();if(auto)toast(t('autoE'));else render()}
function autoExp(){if(!S.set.lastExport){S.set.lastExport=new Date().toISOString();return save()}if((Date.now()-new Date(S.set.lastExport))/864e5>=15)exportAll(true)}
const _vd=vDash;vDash=function(){_vd();$('#v').insertAdjacentHTML('afterbegin',`<div class="card"><button onclick="exportAll()">⬇ ${t('exp2')}</button> <span class="mut">${t('last')}: ${(S.set.lastExport||'-').slice(0,10)}</span></div>`)};
const _r=render;let _ae=0;render=function(){_r();if(U&&!_ae){_ae=1;autoExp()}};
render();
</script></body></html>
